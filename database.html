<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Element Database — Alchemy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-bg: #14151f;
    --panel: #1f2130;
    --panel-raised: #282b3e;
    --parchment: #ece3cc;
    --gold: #c9a227;
    --gold-soft: rgba(201, 162, 39, 0.35);
    --red: #b5453f;
    --red-soft: rgba(181, 69, 63, 0.35);
    --text: #e8e4d8;
    --text-muted: #8d92a8;
    --border: #383c52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink-bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,39,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 64px;
    overflow-wrap: break-word;
  }

  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 16px;
    text-align: center;
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    margin: 0 0 4px;
    color: var(--parchment);
  }

  header p { color: var(--text-muted); margin: 0; font-size: 0.92rem; }
  header a { color: var(--gold); }

  /* Persistent search — visible on both the browse view and any element's
     detail page, so you can jump straight to a new element without
     backing out first. */
  #search-bar {
    max-width: 720px;
    margin: 16px auto 0;
    padding: 0 16px;
    position: relative;
  }

  #db-search {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
  }

  #search-results {
    position: absolute;
    left: 16px;
    right: 16px;
    top: calc(100% + 4px);
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 10;
  }

  #search-results:empty { display: none; }

  .element-tile .tile-label,
  .search-result-item .tile-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-result-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .search-result-item:last-child { border-bottom: none; }
  .search-result-item:hover { background: var(--panel); }
  .search-result-item .tier-badge { margin-left: auto; }

  main {
    max-width: 720px;
    margin: 20px auto 0;
    padding: 0 16px;
  }

  .panel-card {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }

  .tier-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    color: var(--parchment);
    margin: 28px 0 6px;
  }

  .tier-heading:first-of-type { margin-top: 0; }

  .tier-sub {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin: 0 0 10px;
  }

  .element-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .element-tile {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
    max-width: 100%;
    min-width: 0; /* same flex min-width trap as the detail heading — the text here is a bare text node (an anonymous flex item), which can't be targeted directly, so the fix goes on the container itself */
  }

  .element-tile:hover { border-color: var(--gold-soft); }

  .element-tile.nothing-happens-tile {
    background: #0c0d14;
    border-color: #4a4d5e;
    color: #7d8199;
    font-style: italic;
  }

  .element-tile.nothing-happens-tile:hover { border-color: #8a8ea6; color: #a5a9bf; }
  .element-tile img { width: 16px; height: 16px; flex-shrink: 0; }

  .tier-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
  }

  #sort-toggle-row { display: flex; gap: 8px; margin-bottom: 4px; }

  #custom-load-toggle {
    display: block;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin: 10px 0 16px;
  }

  #custom-load-toggle:hover { color: var(--gold); }

  #custom-load-panel {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .custom-load-check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text);
    margin: 8px 0 12px;
    cursor: pointer;
  }

  .custom-load-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  #custom-file-input { font-size: 0.82rem; color: var(--text-muted); max-width: 100%; }

  #custom-load-btn, #custom-reset-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    border-radius: 20px;
    padding: 7px 16px;
    cursor: pointer;
  }

  #custom-reset-btn { border-color: var(--border); color: var(--text-muted); }

  #custom-load-status { margin-top: 10px; }

  .sort-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .sort-toggle.active { border-color: var(--gold); color: var(--gold); }

  .rank-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .rank-row:last-child { border-bottom: none; }

  .rank-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    width: 2.4em;
    flex-shrink: 0;
    text-align: right;
  }

  .rank-name {
    flex: 1;
    min-width: 0;
    color: var(--text);
    text-decoration: none;
    font-size: 0.95rem;
  }

  .rank-name:hover { color: var(--gold); }

  .rank-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--gold);
    flex-shrink: 0;
  }

  /* ---------- Detail view ---------- */

  #detail-view { display: none; }
  #detail-view.active { display: block; }
  #browse-view.hidden { display: none; }

  #back-to-browse {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0;
    margin-bottom: 16px;
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }

  .detail-header img { width: 40px; height: 40px; }

  .detail-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem;
    color: var(--parchment);
    margin: 0;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .detail-meta {
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    margin: 0 0 20px;
  }

  /* Same visual language as the main game's Family Tree cards. */
  .tree-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-soft);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .tree-origin {
    margin: 0 0 6px;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-family: 'IBM Plex Mono', monospace;
    overflow-wrap: anywhere;
  }

  .tree-origin:last-child { margin-bottom: 0; }
  .tree-origin a { color: var(--gold); text-decoration: none; }
  .tree-origin a:hover { text-decoration: underline; }

  .path-step {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }

  .path-step > span:last-child { min-width: 0; overflow-wrap: anywhere; }

  .path-step:last-child { border-bottom: none; }
  .path-step .step-num { color: var(--gold); flex-shrink: 0; }
  .path-step a { color: var(--text); text-decoration: none; }
  .path-step a:hover { color: var(--gold); }

  .empty-note {
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.88rem;
    margin: 0;
    transition: opacity 0.5s ease;
  }

  /* ---------- The Void ----------
     "nothing happens" gets its own treatment: not a different product
     bolted on, but the page of THIS manuscript that's damaged and
     unfinished — same book, wrong page. The heading subverts the site's
     own type hierarchy (mono, normally reserved for small technical
     labels, blown up big) and the body copy switches to a genuinely
     different face entirely — a distressed typewriter, not just a
     recolored version of the same fonts every other element uses.
     Scoped entirely under body.void so it can never leak onto a normal
     element's page. */
  body.void {
    background: #08080b;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(107, 95, 117, 0.05), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(0, 0, 0, 0.5), transparent 50%);
  }

  /* Fog on the window: a fixed vignette that darkens toward the edges of
     the viewport regardless of scroll position, like the page is closing
     in from the outside rather than just being dimly lit. */
  body.void::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,0.5) 72%, rgba(0,0,0,0.94) 100%);
  }

  body.void header a { color: #6b5f75; }
  body.void #db-search { border-color: #1c1b20; }

  body.void .panel-card {
    background: #0e0e12;
    border-color: #1a191e;
    border-radius: 0; /* every other panel on the site is gently rounded — sharp corners here read as wrong on sight */
  }

  body.void .section-label { color: #423f4a; }

  body.void .detail-header h2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.55rem;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    color: #55535e;
    position: relative;
    overflow: hidden;
    text-shadow: 1.5px 0 rgba(178, 62, 90, 0.3), -1.5px 0 rgba(70, 150, 185, 0.28);
    animation: void-tremble 3.2s ease-in-out infinite;
  }

  /* The one moment of drama: a redaction bar sweeps across the element's
     own name once on arrival, as if the page is deciding whether to let
     you read it, then clears for good. */
  body.void .detail-header h2::after {
    content: "";
    position: absolute;
    inset: 0;
    background: #1a191e;
    animation: void-redact-sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes void-redact-sweep {
    0% { transform: translateX(-100%); }
    55% { transform: translateX(0); }
    100% { transform: translateX(101%); }
  }

  /* A near-imperceptible, continuous unsteadiness — sub-pixel on
     purpose. This should read as "can't quite hold still," not as
     something visibly shaking or hard to read. */
  @keyframes void-tremble {
    0%, 100% { transform: translate(0, 0); }
    22% { transform: translate(-0.4px, 0.3px); }
    46% { transform: translate(0.3px, -0.3px); }
    68% { transform: translate(-0.3px, -0.2px); }
    84% { transform: translate(0.3px, 0.3px); }
  }

  body.void .detail-meta { color: #38363f; }

  /* Every body-copy line on this page — the rotating message, the
     combines-into note, the shortest-path note — switches to Special
     Elite: a genuinely different typeface, not just a recolored version
     of the mono font every normal element's page already uses. */
  body.void .empty-note,
  body.void .tree-origin,
  body.void .path-step {
    font-family: 'Special Elite', 'IBM Plex Mono', monospace;
    font-style: normal;
    letter-spacing: 0.02em;
  }

  body.void .empty-note { color: #5a5763; font-size: 0.85rem; animation: void-tremble 4.1s ease-in-out infinite; }
  body.void .tree-origin, body.void .path-step { color: #423f4a; animation: void-tremble 3.7s ease-in-out infinite; }
  body.void .tree-origin a, body.void .path-step a { color: #6b5f75; }
  body.void .path-step .step-num { color: #423f4a; }
  body.void .path-step { border-bottom-color: #1a191e; }

  /* A rare, slow guttering-candle flicker on the whole page — sparingly,
     not constant, so it reads as unsettled rather than gimmicky. */
  body.void #detail-view { animation: void-flicker 19s ease-in-out infinite; }

  @keyframes void-flicker {
    0%, 96%, 100% { opacity: 1; }
    97.5% { opacity: 0.84; }
  }

  @media (prefers-reduced-motion: reduce) {
    body.void .detail-header h2::after { animation: none; display: none; }
    body.void .detail-header h2,
    body.void .empty-note,
    body.void .tree-origin,
    body.void .path-step,
    body.void #detail-view { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Element Database</h1>
  <p>Every element, every recipe, every path. <a href="alchemy_index.html">&larr; Back to the game</a></p>
</header>

<div id="search-bar">
  <input type="text" id="db-search" placeholder="Search elements…" autocomplete="off">
  <div id="search-results"></div>
</div>

<main>
  <section id="browse-view">
    <p id="load-status" class="empty-note">Loading recipes.js…</p>
    <div id="sort-toggle-row" hidden>
      <button class="sort-toggle active" data-sort="tier" type="button">By Tier</button>
      <button class="sort-toggle" data-sort="steps" type="button">By Step Length</button>
    </div>

    <button id="custom-load-toggle" type="button" hidden>Analyze a custom recipe file instead</button>
    <div id="custom-load-panel" hidden>
      <p class="tier-sub">Upload a <code>.js</code> file in the same <code>recipe(a, b, result)</code> format used by the Mods system — including mod files that use more than two ingredients per recipe.</p>
      <label class="custom-load-check"><input type="checkbox" id="custom-include-base"> Merge with the official recipes.js</label>
      <div class="custom-load-row">
        <input type="file" id="custom-file-input" accept=".js">
        <button id="custom-load-btn" type="button">Load</button>
        <button id="custom-reset-btn" type="button" hidden>Reset to official data</button>
      </div>
      <p id="custom-load-status" class="empty-note"></p>
    </div>

    <div id="tier-list"></div>
  </section>

  <section id="detail-view">
    <button id="back-to-browse" type="button">&larr; All elements</button>

    <div class="detail-header">
      <img id="detail-icon" src="" alt="" hidden>
      <h2 id="detail-name"></h2>
    </div>
    <p class="detail-meta" id="detail-tier"></p>

    <div class="panel-card">
      <p class="section-label">Made from</p>
      <div id="detail-made-from"></div>
    </div>

    <div class="panel-card">
      <p class="section-label">Combines into</p>
      <div id="detail-used-in"></div>
    </div>

    <div class="panel-card">
      <p class="section-label" id="detail-path-label">Shortest path</p>
      <div id="detail-path"></div>
    </div>
  </section>
</main>

<script>
  // Same fix already proven necessary for game.js: a plain <script src>
  // tag can sit in a visitor's browser cache indefinitely, so an update
  // shipped here might never actually reach someone who already has the
  // page open or cached. document.write keeps this synchronous and
  // in-order, matching how database.js expects the DOM to already exist.
  document.write('<script src="database.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
