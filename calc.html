<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hex Color Mixer</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: 40px auto;
    text-align: center;
}

input {
    width: 120px;
    font-size: 18px;
    padding: 6px;
    text-transform: uppercase;
}

button {
    font-size: 18px;
    padding: 6px 14px;
    margin-top: 12px;
    cursor: pointer;
}

.swatch-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
}

.mini-swatch {
    width: 24px;
    height: 24px;
    border: 1px solid #000;
    display: inline-block;
    vertical-align: middle;
}

#preview {
    width: 150px;
    height: 150px;
    margin: 20px auto;
    border: 1px solid #000;
}

#result {
    font-size: 24px;
    font-weight: bold;
    margin-top: 10px;
}

hr {
    margin: 40px 0;
}

.combo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 6px 0;
    font-size: 15px;
}

#comboMeta {
    font-size: 13px;
    color: #555;
    margin-top: 10px;
}

.color-chip-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 4px 0;
    font-size: 15px;
}

.color-chip-row button {
    font-size: 13px;
    padding: 2px 8px;
    margin-top: 0;
}

#pathStatus {
    font-size: 14px;
    color: #333;
    margin-top: 10px;
    white-space: pre-line;
}
</style>
</head>
<body>

<h2>Hex Color Mixer</h2>

<p>Color 1</p>
<div class="swatch-row">
    <span id="swatch1" class="mini-swatch"></span>
    <input id="color1" value="#FFFFFF" oninput="updateMiniSwatches()">
</div>

<p>Color 2</p>
<div class="swatch-row">
    <span id="swatch2" class="mini-swatch"></span>
    <input id="color2" value="#000000" oninput="updateMiniSwatches()">
</div>

<br>
<button onclick="mix()">Mix</button>

<div id="preview"></div>

<div id="result"></div>
<button onclick="useResultAsColor1()">Use Result as Color 1</button>

<hr>

<h3>Find Combinations for a Color</h3>
<p>Target color</p>
<div class="swatch-row">
    <span id="targetSwatch" class="mini-swatch"></span>
    <input id="targetColor" value="#808080" oninput="updateMiniSwatches()">
</div>
<br>
<button onclick="findCombos()">Find Combinations</button>

<div id="comboList"></div>
<button id="seeMoreBtn" onclick="showMoreCombos()" style="display:none">See 10 More</button>
<div id="comboMeta"></div>

<hr>

<h3>Path to a Color</h3>

<p>Starting colors</p>
<div id="defaultColorList"></div>

<p>Added starting colors</p>
<div id="addedColorList"></div>
<div class="swatch-row">
    <input id="newStartColorInput" placeholder="#RRGGBB">
    <button onclick="addStartColor()">Add</button>
</div>

<p>Force through (optional)</p>
<div id="forcedColorList"></div>
<div class="swatch-row">
    <input id="newForcedColorInput" placeholder="#RRGGBB">
    <button onclick="addForcedColor()">Add</button>
</div>

<p>Target color</p>
<div class="swatch-row">
    <span id="pathTargetSwatch" class="mini-swatch"></span>
    <input id="pathTargetColor" value="#336699" oninput="updateMiniSwatches()">
</div>
<br>
<button onclick="findColorPath()">Find Path</button>

<div id="pathStatus"></div>
<div id="pathSteps"></div>

<script>
function hexToRgb(hex) {
    hex = hex.replace("#", "");
    if (hex.length !== 6) return null;
    return {
        r: parseInt(hex.substring(0, 2), 16),
        g: parseInt(hex.substring(2, 4), 16),
        b: parseInt(hex.substring(4, 6), 16)
    };
}

function rgbToHex(r, g, b) {
    return "#" +
        r.toString(16).padStart(2, "0") +
        g.toString(16).padStart(2, "0") +
        b.toString(16).padStart(2, "0");
}

function updateMiniSwatches() {
    const c1 = document.getElementById("color1").value;
    const c2 = document.getElementById("color2").value;
    const ct = document.getElementById("targetColor").value;
    const pt = document.getElementById("pathTargetColor").value;
    if (hexToRgb(c1)) document.getElementById("swatch1").style.background = c1;
    if (hexToRgb(c2)) document.getElementById("swatch2").style.background = c2;
    if (hexToRgb(ct)) document.getElementById("targetSwatch").style.background = ct;
    if (hexToRgb(pt)) document.getElementById("pathTargetSwatch").style.background = pt;
}

let lastMixedHex = null;

function useResultAsColor1() {
    if (!lastMixedHex) {
        alert("Mix two colors first.");
        return;
    }
    document.getElementById("color1").value = lastMixedHex;
    updateMiniSwatches();
}

function mix() {
    const c1 = hexToRgb(document.getElementById("color1").value);
    const c2 = hexToRgb(document.getElementById("color2").value);

    if (!c1 || !c2) {
        alert("Please enter valid 6-digit hex colors.");
        return;
    }

    const r = Math.round((c1.r + c2.r) / 2);
    const g = Math.round((c1.g + c2.g) / 2);
    const b = Math.round((c1.b + c2.b) / 2);

    const mixed = rgbToHex(r, g, b).toUpperCase();
    lastMixedHex = mixed;

    document.getElementById("preview").style.background = mixed;
    document.getElementById("result").textContent = mixed;
}

// ---- Combination finder ----
// For a target channel value t, find every (a,b) pair (0-255, a<=b) where
// Math.round((a+b)/2) === t. Sorted descending by delta (b-a) so the most
// visually distinct pairs come first.
function getChannelPairs(t) {
    const pairs = [];
    for (let a = 0; a <= t; a++) {
        const b = 2 * t - a;
        if (b >= a && b <= 255) pairs.push({ a, b, delta: b - a });
    }
    for (let a = 0; a <= t - 1; a++) {
        const b = 2 * t - 1 - a;
        if (b >= a && b <= 255 && b !== 2 * t - a) pairs.push({ a, b, delta: b - a });
    }
    pairs.sort((x, y) => y.delta - x.delta);
    return pairs;
}

let allCombos = [];
let shownCount = 0;

function findCombos() {
    const t = hexToRgb(document.getElementById("targetColor").value);
    if (!t) {
        alert("Please enter a valid 6-digit hex color.");
        return;
    }

    const rPairs = getChannelPairs(t.r).slice(0, 50);
    const gPairs = getChannelPairs(t.g).slice(0, 50);
    const bPairs = getChannelPairs(t.b).slice(0, 50);

    // Score every candidate triple by total spread (sum of channel deltas).
    const triples = [];
    for (const rp of rPairs) {
        for (const gp of gPairs) {
            for (const bp of bPairs) {
                triples.push({ rp, gp, bp, spread: rp.delta + gp.delta + bp.delta });
            }
        }
    }
    triples.sort((x, y) => y.spread - x.spread);

    // Expand top triples into actual color-pair combos (there are up to 8
    // channel-assignment variants per triple; dedupe swapped pairs).
    const seen = new Set();
    const results = [];
    const CAP = 300;

    for (const tri of triples) {
        if (results.length >= CAP) break;
        const rOpts = tri.rp.a === tri.rp.b ? [[tri.rp.a, tri.rp.b]] : [[tri.rp.a, tri.rp.b], [tri.rp.b, tri.rp.a]];
        const gOpts = tri.gp.a === tri.gp.b ? [[tri.gp.a, tri.gp.b]] : [[tri.gp.a, tri.gp.b], [tri.gp.b, tri.gp.a]];
        const bOpts = tri.bp.a === tri.bp.b ? [[tri.bp.a, tri.bp.b]] : [[tri.bp.a, tri.bp.b], [tri.bp.b, tri.bp.a]];

        for (const [r1, r2] of rOpts) {
            for (const [g1, g2] of gOpts) {
                for (const [b1, b2] of bOpts) {
                    let hex1 = rgbToHex(r1, g1, b1).toUpperCase();
                    let hex2 = rgbToHex(r2, g2, b2).toUpperCase();
                    if (hex1 > hex2) [hex1, hex2] = [hex2, hex1];
                    const key = hex1 + "_" + hex2;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    results.push({ hex1, hex2, spread: tri.spread });
                    if (results.length >= CAP) break;
                }
                if (results.length >= CAP) break;
            }
            if (results.length >= CAP) break;
        }
    }

    results.sort((x, y) => y.spread - x.spread);

    allCombos = results;
    shownCount = 0;
    document.getElementById("comboList").innerHTML = "";
    showMoreCombos();
}

function showMoreCombos() {
    const list = document.getElementById("comboList");
    const next = allCombos.slice(shownCount, shownCount + 10);

    next.forEach(c => {
        const row = document.createElement("div");
        row.className = "combo-row";
        row.innerHTML =
            '<span class="mini-swatch" style="background:' + c.hex1 + '"></span>' +
            '<span>' + c.hex1 + ' + ' + c.hex2 + '</span>' +
            '<span class="mini-swatch" style="background:' + c.hex2 + '"></span>';
        list.appendChild(row);
    });

    shownCount += next.length;

    const meta = document.getElementById("comboMeta");
    const seeMoreBtn = document.getElementById("seeMoreBtn");
    if (shownCount >= allCombos.length) {
        seeMoreBtn.style.display = "none";
        meta.textContent = "Showing all " + allCombos.length + " (capped at 300 by spread — the true total for most colors is in the millions).";
    } else {
        seeMoreBtn.style.display = "inline-block";
        meta.textContent = "Showing " + shownCount + " of " + allCombos.length + " (capped at 300 by spread — the true total for most colors is in the millions).";
    }
}

// ---- Path to a Color ----
const defaultColors = [
    { name: "White", hex: "#FFFFFF", enabled: true },
    { name: "Black", hex: "#000000", enabled: true },
    { name: "Grey",  hex: "#808080", enabled: true },
    { name: "Red",   hex: "#FF0000", enabled: true },
    { name: "Orange",hex: "#FFA500", enabled: true },
    { name: "Yellow",hex: "#FFFF00", enabled: true },
    { name: "Green", hex: "#00FF00", enabled: true },
    { name: "Blue",  hex: "#0000FF", enabled: true }
];
let addedStartColors = [];
let forcedColors = [];

function renderDefaultColorList() {
    const el = document.getElementById("defaultColorList");
    el.innerHTML = "";
    defaultColors.forEach((c, i) => {
        const row = document.createElement("div");
        row.className = "color-chip-row";
        const checkboxId = "defColor" + i;
        row.innerHTML =
            '<input type="checkbox" id="' + checkboxId + '" ' + (c.enabled ? "checked" : "") + '>' +
            '<span class="mini-swatch" style="background:' + c.hex + '"></span>' +
            '<span>' + c.name + ' (' + c.hex + ')</span>';
        el.appendChild(row);
        document.getElementById(checkboxId).addEventListener("change", (e) => {
            defaultColors[i].enabled = e.target.checked;
        });
    });
}

function renderAddedColorList() {
    const el = document.getElementById("addedColorList");
    el.innerHTML = "";
    addedStartColors.forEach((hex, i) => {
        const row = document.createElement("div");
        row.className = "color-chip-row";
        row.innerHTML =
            '<span class="mini-swatch" style="background:' + hex + '"></span>' +
            '<span>' + hex + '</span>' +
            '<button onclick="removeStartColor(' + i + ')">Remove</button>';
        el.appendChild(row);
    });
}

function addStartColor() {
    const input = document.getElementById("newStartColorInput");
    const hex = input.value.trim().toUpperCase();
    if (!hexToRgb(hex)) {
        alert("Please enter a valid 6-digit hex color.");
        return;
    }
    addedStartColors.push(hex);
    input.value = "";
    renderAddedColorList();
}

function removeStartColor(i) {
    addedStartColors.splice(i, 1);
    renderAddedColorList();
}

function renderForcedColorList() {
    const el = document.getElementById("forcedColorList");
    el.innerHTML = "";
    forcedColors.forEach((hex, i) => {
        const row = document.createElement("div");
        row.className = "color-chip-row";
        row.innerHTML =
            '<span class="mini-swatch" style="background:' + hex + '"></span>' +
            '<span>' + hex + '</span>' +
            '<button onclick="removeForcedColor(' + i + ')">Remove</button>';
        el.appendChild(row);
    });
}

function addForcedColor() {
    const input = document.getElementById("newForcedColorInput");
    const hex = input.value.trim().toUpperCase();
    if (!hexToRgb(hex)) {
        alert("Please enter a valid 6-digit hex color.");
        return;
    }
    forcedColors.push(hex);
    input.value = "";
    renderForcedColorList();
}

function removeForcedColor(i) {
    forcedColors.splice(i, 1);
    renderForcedColorList();
}

function colorDistance(hexA, hexB) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return Math.abs(a.r - b.r) + Math.abs(a.g - b.g) + Math.abs(a.b - b.b);
}

// Exhaustive, exact frontier BFS (no sampling — sampling can't reliably hit
// exact targets). Runs generation by generation; caller decides when to stop.
function runBfsGenerations(pool, frontier, generationsToRun) {
    let gen = frontier.length ? (pool.get(frontier[0]).gen) : 0;
    for (let i = 0; i < generationsToRun; i++) {
        if (frontier.length === 0) break;
        const poolKeys = [...pool.keys()];
        const newFrontier = [];
        for (const a of frontier) {
            for (const b of poolKeys) {
                const m = mixHexPair(a, b);
                if (!pool.has(m)) {
                    pool.set(m, { gen: gen + 1, pa: a, pb: b });
                    newFrontier.push(m);
                }
            }
        }
        gen++;
        frontier = newFrontier;
    }
    return frontier;
}

function mixHexPair(h1, h2) {
    const a = hexToRgb(h1), b = hexToRgb(h2);
    return rgbToHex(Math.round((a.r + b.r) / 2), Math.round((a.g + b.g) / 2), Math.round((a.b + b.b) / 2)).toUpperCase();
}

function findClosest(pool, targetHex) {
    let best = null, bestDist = Infinity;
    for (const hex of pool.keys()) {
        const d = colorDistance(hex, targetHex);
        if (d < bestDist) { bestDist = d; best = hex; }
    }
    return { hex: best, dist: bestDist };
}

// Trace a color's ancestry back to start colors (gen 0), collecting every
// unique intermediate build step. Steps from multiple calls can be merged
// (pass in a shared `stepsMap` and `order` array) so shared ancestors are
// only listed once.
function collectSteps(pool, hex, stepsMap, order) {
    const entry = pool.get(hex);
    if (!entry || entry.pa === null) return; // start color, nothing to build
    if (stepsMap.has(hex)) return; // already collected
    collectSteps(pool, entry.pa, stepsMap, order);
    collectSteps(pool, entry.pb, stepsMap, order);
    stepsMap.set(hex, entry);
    order.push(hex);
}

function findColorPath() {
    const targetHex = document.getElementById("pathTargetColor").value.trim().toUpperCase();
    if (!hexToRgb(targetHex)) {
        alert("Please enter a valid 6-digit hex color for the target.");
        return;
    }

    const startSet = [
        ...defaultColors.filter(c => c.enabled).map(c => c.hex),
        ...addedStartColors
    ];
    if (startSet.length < 2) {
        alert("Select or add at least 2 starting colors.");
        return;
    }

    const statusEl = document.getElementById("pathStatus");
    const stepsEl = document.getElementById("pathSteps");
    statusEl.textContent = "Searching…";
    stepsEl.innerHTML = "";

    // Let the browser paint the "Searching…" message before the heavy work.
    setTimeout(() => {
        const pool = new Map();
        startSet.forEach(hex => pool.set(hex, { gen: 0, pa: null, pb: null }));
        let frontier = [...pool.keys()];

        // Fast pass (generation 3) — usually a few hundred ms.
        frontier = runBfsGenerations(pool, frontier, 3);
        let best = findClosest(pool, targetHex);

        // If not a close enough match yet and the search hasn't converged,
        // spend one more (slower) generation trying to do better.
        const GOOD_ENOUGH_DIST = 10;
        if (best.dist > GOOD_ENOUGH_DIST && frontier.length > 0) {
            frontier = runBfsGenerations(pool, frontier, 1);
            const better = findClosest(pool, targetHex);
            if (better.dist < best.dist) best = better;
        }

        // Which forced colors actually got discovered in the pool?
        const foundForced = forcedColors.filter(h => pool.has(h));
        const missingForced = forcedColors.filter(h => !pool.has(h));

        // Build the combined step list: the best match, plus any forced
        // colors that were found (shared ancestors only listed once).
        const stepsMap = new Map();
        const order = [];
        foundForced.forEach(h => collectSteps(pool, h, stepsMap, order));
        collectSteps(pool, best.hex, stepsMap, order);

        // Render status
        let statusLines = [];
        if (best.dist === 0) {
            statusLines.push("Exact match found: " + best.hex);
        } else {
            const a = hexToRgb(best.hex), t = hexToRgb(targetHex);
            statusLines.push("Closest reachable color: " + best.hex +
                " (off by R:" + Math.abs(a.r - t.r) + " G:" + Math.abs(a.g - t.g) + " B:" + Math.abs(a.b - t.b) + ")");
            if (best.dist > 40) {
                statusLines.push("That's a fairly rough match — try adding more (and more varied) starting colors for something closer.");
            }
        }
        if (forcedColors.length > 0) {
            if (foundForced.length > 0) statusLines.push("Forced colors reached: " + foundForced.join(", "));
            if (missingForced.length > 0) statusLines.push("Forced colors not reached within the search budget: " + missingForced.join(", ") + " — try adding more starting colors, or deselect them.");
        }
        statusEl.textContent = statusLines.join("\n");

        // Render steps
        order.forEach((hex, i) => {
            const entry = stepsMap.get(hex);
            const row = document.createElement("div");
            row.className = "combo-row";
            row.innerHTML =
                "Step " + (i + 1) + ": " +
                '<span class="mini-swatch" style="background:' + entry.pa + '"></span>' + entry.pa + " + " +
                '<span class="mini-swatch" style="background:' + entry.pb + '"></span>' + entry.pb + " = " +
                '<span class="mini-swatch" style="background:' + hex + '"></span>' + hex;
            stepsEl.appendChild(row);
        });
        if (order.length === 0) {
            const p = document.createElement("div");
            p.textContent = best.dist === 0 ? "(already one of your starting colors — no mixing needed)" : "";
            stepsEl.appendChild(p);
        }
    }, 10);
}

renderDefaultColorList();
renderAddedColorList();
renderForcedColorList();
updateMiniSwatches();
</script>

</body>
</html>
