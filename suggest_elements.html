<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggest an Element — Alchemy Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-bg: #14151f;
    --panel: #1f2130;
    --panel-raised: #282b3e;
    --parchment: #ece3cc;
    --gold: #c9a227;
    --gold-soft: rgba(201, 162, 39, 0.35);
    --red: #b5453f;
    --red-soft: rgba(181, 69, 63, 0.35);
    --text: #e8e4d8;
    --text-muted: #8d92a8;
    --border: #383c52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink-bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,39,0.05), transparent 40%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 64px;
  }

  header { max-width: 760px; margin: 0 auto 24px; text-align: center; }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 2.4rem);
    margin: 0 0 4px;
    color: var(--parchment);
  }

  header p { color: var(--text-muted); margin: 0; font-size: 0.92rem; }

  header a { color: var(--gold); }

  main { max-width: 760px; margin: 0 auto; }

  .tabs { display: flex; gap: 4px; padding: 0 8px; }

  .tab-button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: var(--panel);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 8px 14px;
    cursor: pointer;
  }

  .tab-button.active { background: var(--panel-raised); color: var(--gold); position: relative; top: 1px; }

  .panel-card {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    padding: 24px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .picker-pair { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }

  @media (min-width: 640px) {
    .picker-pair { flex-direction: row; }
    .picker-column { flex: 1; }
  }

  .picker-column h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    color: var(--parchment);
    margin: 0 0 8px;
  }

  .picker-search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    margin-bottom: 8px;
  }

  .picker-list {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
  }

  .element-tile {
    max-width: 100%;
    overflow-wrap: anywhere;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    background: var(--ink-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 5px 12px;
    cursor: pointer;
  }

  .element-tile.selected {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201, 162, 39, 0.1);
  }

  #suggestion-preview {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    color: var(--parchment);
    text-align: center;
    overflow-wrap: anywhere;
    margin: 4px 0 12px;
  }

  #suggestion-warning {
    color: var(--red);
    font-size: 0.85rem;
    text-align: center;
    overflow-wrap: anywhere;
    margin: 0 0 12px;
  }

  .suggest-form-row { margin-bottom: 12px; }

  .suggest-form-row label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .suggest-form-row input[type="text"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  #add-to-queue-btn, #submit-queue-btn {
    background: var(--gold);
    color: var(--ink-bg);
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    width: 100%;
  }

  #add-to-queue-btn:disabled, #submit-queue-btn:disabled {
    background: var(--panel);
    color: var(--text-muted);
    cursor: default;
  }

  #suggest-status, #queue-status {
    text-align: center;
    font-size: 0.85rem;
    color: var(--gold);
    min-height: 1.4em;
    margin-top: 10px;
  }

  .queue-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }

  .queue-row-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .queue-remove-btn {
    background: none;
    border: 1px solid var(--red-soft);
    color: #e0a8a4;
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  #queue-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  #queue-count { color: var(--gold); }
</style>
</head>
<body>

<header>
  <h1>Suggest an Element</h1>
  <p>Pick two of YOUR discovered elements that don't combine yet, say what they should make. No Discord account needed. <a href="alchemy_index.html">&larr; Back to the game</a></p>
</header>

<main>
  <div class="tabs">
    <button class="tab-button active" data-tab="suggest">Suggest</button>
    <button class="tab-button" data-tab="queue">Queue</button>
  </div>

  <div class="panel-card">

    <section id="tab-suggest" class="tab-panel active">
      <div class="picker-pair">
        <div class="picker-column">
          <h3>First element</h3>
          <input type="text" id="picker-a-search" class="picker-search" placeholder="Search…">
          <div id="picker-a-list" class="picker-list"></div>
        </div>
        <div class="picker-column">
          <h3>Second element</h3>
          <input type="text" id="picker-b-search" class="picker-search" placeholder="Search…">
          <div id="picker-b-list" class="picker-list"></div>
        </div>
      </div>

      <p id="suggestion-preview">Pick two elements above.</p>
      <p id="suggestion-warning" hidden></p>

      <div class="suggest-form-row">
        <label for="suggestion-result">What should this combine into?</label>
        <input type="text" id="suggestion-result" maxlength="60" placeholder="e.g. Steam" disabled>
      </div>

      <div class="suggest-form-row">
        <label for="suggestion-credit">Your name or Discord username (optional)</label>
        <input type="text" id="suggestion-credit" maxlength="40" placeholder="Leave blank to stay anonymous">
      </div>

      <button id="add-to-queue-btn" type="button" disabled>Add to queue</button>
      <p id="suggest-status"></p>
    </section>

    <section id="tab-queue" class="tab-panel">
      <div id="queue-header">
        <span>Your queued suggestions</span>
        <span><span id="queue-count">0</span> queued</span>
      </div>
      <div id="queue-list"></div>
      <button id="submit-queue-btn" type="button" disabled>Submit all to Discord</button>
      <p id="queue-status"></p>
    </section>

  </div>
</main>

<script src="suggest.js"></script>
</body>
</html>
