<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="#c68a5a" stroke-width="4"/>

  <!-- faint circle and square, echoing Vitruvian geometry -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#c68a5a" stroke-width="1" opacity="0.4"/>
  <rect x="26" y="26" width="48" height="48" fill="none" stroke="#c68a5a" stroke-width="1" opacity="0.4"/>

  <!-- figure -->
  <circle cx="50" cy="27" r="6" fill="#c68a5a"/>
  <line x1="50" y1="34" x2="50" y2="56" stroke="#c68a5a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="27" y2="29" stroke="#c68a5a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="73" y2="29" stroke="#c68a5a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="56" x2="35" y2="79" stroke="#c68a5a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="56" x2="65" y2="79" stroke="#c68a5a" stroke-width="3.5" stroke-linecap="round"/>
</svg>
