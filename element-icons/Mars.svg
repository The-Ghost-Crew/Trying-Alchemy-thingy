<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="marsClip">
      <circle cx="50" cy="50" r="30"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="#c1440e" stroke-width="4"/>

  <!-- red sphere -->
  <circle cx="50" cy="50" r="30" fill="#c1440e"/>

  <g clip-path="url(#marsClip)">
    <!-- surface markings -->
    <ellipse cx="40" cy="52" rx="8" ry="5" fill="#8a3008" opacity="0.7"/>
    <ellipse cx="60" cy="44" rx="6" ry="4" fill="#8a3008" opacity="0.6"/>

    <!-- polar ice caps -->
    <ellipse cx="50" cy="23" rx="9" ry="5" fill="#f0ece0"/>
    <ellipse cx="50" cy="77" rx="8" ry="4.5" fill="#f0ece0"/>
  </g>
</svg>
