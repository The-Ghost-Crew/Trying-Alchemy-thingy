<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="neptuneClip">
      <circle cx="50" cy="50" r="28"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="#2d52b8" stroke-width="4"/>

  <!-- vivid blue sphere -->
  <circle cx="50" cy="50" r="28" fill="#2d52b8"/>

  <g clip-path="url(#neptuneClip)">
    <!-- great dark spot -->
    <ellipse cx="38" cy="46" rx="9" ry="6" fill="#16255a" opacity="0.85"/>

    <!-- cloud streaks -->
    <path d="M 26,32 Q 42,27 60,34" fill="none" stroke="#eef2fa" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 48,60 Q 60,55 72,62" fill="none" stroke="#eef2fa" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
