<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="#c4dce8" stroke-width="4"/>

  <!-- metallic cap -->
  <rect x="42" y="14" width="16" height="10" rx="2" fill="#b8bcc4"/>

  <!-- neck -->
  <rect x="44" y="22" width="12" height="10" fill="#c4dce8"/>

  <!-- gradual curved shoulder, corners at x=38 and x=62 -->
  <path d="M 38,44 Q 38,32 44,32 L 56,32 Q 62,32 62,44 Z" fill="#c4dce8"/>

  <!-- body, sharp top corners flush with shoulder, rounded base only -->
  <path d="M 38,44 L 62,44 L 62,76 Q 62,82 56,82 L 44,82 Q 38,82 38,76 Z" fill="#c4dce8"/>
</svg>
