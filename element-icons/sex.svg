<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sexGrad" x1="64" y1="20" x2="38" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a8fd4"/>
      <stop offset="100%" stop-color="#e85a9c"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="url(#sexGrad)" stroke-width="4"/>

  <!-- Venus circle, lower-left -->
  <circle cx="38" cy="52" r="15" fill="none" stroke="url(#sexGrad)" stroke-width="5"/>

  <!-- Venus cross -->
  <line x1="38" y1="67" x2="38" y2="86" stroke="url(#sexGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="26" y1="76" x2="50" y2="76" stroke="url(#sexGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Mars circle, upper-right -->
  <circle cx="64" cy="32" r="13" fill="none" stroke="url(#sexGrad)" stroke-width="5"/>

  <!-- Mars arrow, piercing through the Venus ring -->
  <path d="M 53.7,39.9 L 30.2,58.0 M 30.2,58.0 L 33.3,50.6 M 30.2,58.0 L 38.1,56.9"
        fill="none" stroke="url(#sexGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
