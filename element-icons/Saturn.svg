<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="saturnClip">
      <circle cx="50" cy="50" r="20"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="#e8d19c" stroke-width="4"/>

  <!-- rings (behind sphere) -->
  <ellipse cx="50" cy="50" rx="40" ry="13" fill="none" stroke="#c9b88a" stroke-width="4" transform="rotate(-15 50 50)"/>
  <ellipse cx="50" cy="50" rx="34" ry="11" fill="none" stroke="#c9b88a" stroke-width="4" transform="rotate(-15 50 50)"/>

  <!-- sphere -->
  <circle cx="50" cy="50" r="20" fill="#e8d19c"/>

  <g clip-path="url(#saturnClip)">
    <!-- subtle banding -->
    <rect x="30" y="38" width="40" height="2.5" fill="#c9b88a" opacity="0.4"/>
    <rect x="30" y="46" width="40" height="3" fill="#c9b88a" opacity="0.3"/>
    <rect x="30" y="58" width="40" height="2.5" fill="#c9b88a" opacity="0.35"/>
    <rect x="30" y="65" width="40" height="2" fill="#c9b88a" opacity="0.3"/>
  </g>
</svg>
