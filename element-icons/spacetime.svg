<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="spacetimeGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6a5a9c"/>
      <stop offset="100%" stop-color="#8a93a8"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="46" fill="#14151f" stroke="url(#spacetimeGrad)" stroke-width="4"/>

  <!-- bent hourglass: gravitational-lensing curve instead of straight triangle edges -->
  <path d="M 26,24 C 38,36 62,36 74,24 L 50,50 Z" fill="none" stroke="url(#spacetimeGrad)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 26,76 C 38,64 62,64 74,76 L 50,50 Z" fill="none" stroke="url(#spacetimeGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- singularity point -->
  <circle cx="50" cy="50" r="3" fill="#c9c6da"/>

  <!-- stars along the curve -->
  <path d="M 70,30 L 71.5,33.5 L 75,33.5 L 72.2,35.8 L 73.2,39.3 L 70,37.2 L 66.8,39.3 L 67.8,35.8 L 65,33.5 L 68.5,33.5 Z" fill="#c9c6da"/>
  <circle cx="29" cy="70" r="2" fill="#c9c6da"/>
</svg>
