<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Infinite Number Recipe Generator</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:40px;
    background:#121212;
    color:#f0f0f0;
}

h2{
    text-align:center;
    color:#ffffff;
}

.controls{
    margin:20px 0;
    text-align:center;
}

button{
    padding:10px 18px;
    margin:4px;
    cursor:pointer;
    font-size:16px;
    background:#2d2d2d;
    color:#ffffff;
    border:1px solid #555;
    border-radius:6px;
}

button:hover{
    background:#3b3b3b;
}

button:active{
    background:#4a4a4a;
}

#output{
    background:#1e1e1e;
    border:1px solid #444;
    border-radius:8px;
    padding:15px;
    min-height:250px;
    font-family:Consolas,Monaco,monospace;
}

/* Fullscreen countdown */

#countdown{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.82);
    color:white;
    font-size:220px;
    font-weight:900;
    text-shadow:
        0 0 15px white,
        0 0 40px cyan,
        0 0 70px magenta;
    z-index:9999;
    user-select:none;
    animation:pop .9s ease;
}

@keyframes pop{
    0%{
        transform:scale(.2);
        opacity:0;
    }
    30%{
        transform:scale(1.25);
        opacity:1;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}
</style>
</head>

<body>

<h2>Why number + number = sum recipes are not allowed</h2>

<div class="controls">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="copy">Copy</button>
</div>

<div id="output"></div>

<div id="countdown"></div>

<script>

const output=document.getElementById("output");
const countdown=document.getElementById("countdown");

const rainbow=[
"red",
"orangered",
"orange",
"gold",
"yellow",
"greenyellow",
"lime",
"springgreen",
"cyan",
"deepskyblue",
"dodgerblue",
"blue",
"indigo",
"violet",
"magenta",
"deeppink"
];

let colorIndex=0;

let running=false;

let sum=2;
let index=1;

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

async function showCountdown(){

    countdown.style.display="flex";

    const values=["3","2","1","GO!"];

    for(const value of values){

        countdown.textContent=value;

        countdown.style.animation="none";
        void countdown.offsetWidth;
        countdown.style.animation="pop .9s ease";

        await sleep(value==="GO!" ? 700 : 1000);
    }

    countdown.style.display="none";
}

function generateBatch(){

    if(!running) return;

    let html="";

    while(html.length<25000){

        while(index<=Math.floor(sum/2)){

            const a=index;
            const b=sum-a;

            if(b>=a){

                const color=rainbow[colorIndex%rainbow.length];

                html+=`<div style="color:${color};">recipe("${a}", "${b}", "${sum}");</div>`;

                colorIndex++;
            }

            index++;

            if(html.length>=25000){
                break;
            }
        }

        if(index>Math.floor(sum/2)){
            sum++;
            index=1;
        }
    }

    output.insertAdjacentHTML("beforeend",html);

    requestAnimationFrame(generateBatch);
}

document.getElementById("start").onclick=async function(){

    if(running) return;

    await showCountdown();

    running=true;

    generateBatch();

};

document.getElementById("stop").onclick=function(){

    running=false;

};

document.getElementById("copy").onclick=function(){

    navigator.clipboard.writeText(output.innerText);

};

</script>

</body>
</html>
