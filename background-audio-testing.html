<!DOCTYPE html>
<html>
<body style="background:#111;color:white;text-align:center;padding:50px">

<h1>Alchemy Prototype</h1>
<p>Click to begin</p>

<script>

const audio = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, start, duration, type = "triangle", volume = 0.03) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(volume, start + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start(start);
    osc.stop(start + duration);
}

const melody = [
    { n: 293.66, t: 0.0, l: 0.8 },
    { n: 349.23, t: 1.0, l: 0.6 },
    { n: 392.00, t: 2.0, l: 0.9 },
    { n: 440.00, t: 3.2, l: 0.7 },
    { n: 392.00, t: 4.3, l: 0.8 },
    { n: 349.23, t: 5.3, l: 0.8 },
    { n: 329.63, t: 6.4, l: 0.7 },
    { n: 293.66, t: 7.4, l: 1.2 }
];

function playLoop() {
    const now = audio.currentTime + 0.1;

    playTone(146.83, now, 8.8, "sine", 0.02);
    playTone(220.00, now, 8.8, "triangle", 0.012);

    melody.forEach(note => {
        playTone(note.n, now + note.t, note.l, "triangle", 0.025);
    });
}

document.addEventListener("click", async () => {
    await audio.resume();
    playLoop();
    setInterval(playLoop, 8800);
}, { once: true });

    
</script>

</body>
</html>
