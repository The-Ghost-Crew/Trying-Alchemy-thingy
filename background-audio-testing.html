<!DOCTYPE html>
<html>
<body style="background:#111;color:white;text-align:center;padding:50px">

<h1>Alchemy Prototype</h1>
<p>Click to begin</p>

<script>

const audio = new (window.AudioContext || window.webkitAudioContext)();


// ===============================
// Cathedral Reverb
// ===============================

function createCathedralReverb() {
    const convolver = audio.createConvolver();

    const length = audio.sampleRate * 7; // 7 second decay
    const impulse = audio.createBuffer(
        2,
        length,
        audio.sampleRate
    );

    for (let channel = 0; channel < impulse.numberOfChannels; channel++) {
        const data = impulse.getChannelData(channel);

        for (let i = 0; i < length; i++) {
            const decay = Math.pow(1 - i / length, 3);
            data[i] = (Math.random() * 2 - 1) * decay;
        }
    }

    convolver.buffer = impulse;
    return convolver;
}

const reverb = createCathedralReverb();

const master = audio.createGain();
master.gain.value = 0.5;

master.connect(reverb);
reverb.connect(audio.destination);


// ===============================
// Tone Generator
// ===============================

function createTone(
    frequency,
    type,
    volume,
    attack,
    release
) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    const now = audio.currentTime;

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(
        volume,
        now + attack
    );

    gain.gain.setValueAtTime(
        volume,
        now + attack + 0.1
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + attack + release
    );

    osc.connect(gain);
    gain.connect(master);

    osc.start(now);
    osc.stop(now + attack + release);
}


// ===============================
// Ancient Drone
// ===============================

function playDrone() {

    // Deep D
    createTone(
        146.83,
        "sine",
        0.08,
        3,
        12
    );

    // Fifth A
    createTone(
        220,
        "sine",
        0.05,
        4,
        12
    );
}


// ===============================
// Layered Strings
// ===============================

function playStrings() {

    const strings = [
        293.66, // D
        349.23, // F
        440.00, // A
        523.25  // C
    ];

    strings.forEach(freq => {

        createTone(
            freq,
            "triangle",
            0.025,
            4,
            15
        );

    });
}


// ===============================
// Start
// ===============================

document.addEventListener(
    "click",
    async () => {

        await audio.resume();

        playDrone();
        playStrings();

    },
    { once: true }
);

    
</script>

</body>
</html>
